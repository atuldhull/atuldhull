<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Atul Dhull: CS undergrad at BMSIT, full-stack and applied ML. I ship things and keep them running.">
  <defs>
    <radialGradient id="glow" cx="0.88" cy="0.05" r="0.65">
      <stop offset="0" stop-color="#A66BFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A66BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <style>
      .d { font-family: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
      .m { font-family: "IBM Plex Mono", Consolas, "SF Mono", monospace; }
      .run { animation: run 26s linear infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .ping { transform-origin: 1008px 252px; animation: ping 1.8s ease-out infinite; }
      @keyframes run { from { transform: translateX(0); } to { transform: translateX(-760px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3.2); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .run, .blink, .ping { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#171717"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>

    <text x="64" y="86" class="m" font-size="15" fill="#A66BFF" letter-spacing="3">BENGALURU · CS @ BMSIT · FULL-STACK + APPLIED ML</text>

    <text x="60" y="184" class="d" font-size="96" fill="#ffffff" textLength="520" lengthAdjust="spacingAndGlyphs">Atul Dhull</text>

    <g transform="rotate(-1.5 330 236)">
      <rect x="58" y="206" width="560" height="56" rx="8" fill="#FFF21A"/>
    </g>
    <text x="72" y="246" class="d" font-size="40" fill="#171717" textLength="532" lengthAdjust="spacingAndGlyphs">I ship things and keep them running.</text>

    <!-- terminal card -->
    <g transform="rotate(3 1000 190)">
      <rect x="800" y="90" width="400" height="200" rx="16" fill="#0f0f0f" stroke="#2d2d2d"/>
      <circle cx="826" cy="114" r="6" fill="#ff5f57"/><circle cx="846" cy="114" r="6" fill="#febc2e"/><circle cx="866" cy="114" r="6" fill="#28c840"/>
      <text x="826" y="160" class="m" font-size="15" fill="#b4b4b4">$ whoami</text>
      <text x="826" y="186" class="m" font-size="15" fill="#FFF21A">atul · full-stack + applied ML</text>
      <text x="826" y="220" class="m" font-size="15" fill="#b4b4b4">$ status</text>
      <circle cx="1008" cy="252" r="5" fill="#28c840"/>
      <circle class="ping" cx="1008" cy="252" r="5" fill="#28c840"/>
      <text x="826" y="257" class="m" font-size="15" fill="#ffffff">open to internships</text>
      <rect class="blink" x="1024" y="243" width="9" height="17" fill="#FFF21A"/>
    </g>

    <!-- marquee band -->
    <g transform="rotate(-2 640 352)">
      <rect x="-40" y="326" width="1360" height="46" fill="#A66BFF"/>
      <g class="run">
        <text x="0" y="357" class="d" font-size="22" fill="#171717">EVENTFLOW ✶ AICTE APPROVALS ✶ MATH COLLECTIVE ✶ ASTRA ✶ JARVIS ✶ HOMERELAY ✶ EVENTFLOW ✶ AICTE APPROVALS ✶ MATH COLLECTIVE ✶ ASTRA ✶ JARVIS ✶ HOMERELAY ✶ EVENTFLOW ✶ AICTE APPROVALS ✶</text>
      </g>
    </g>
  </g>
</svg>
